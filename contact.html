  <body>
    <nav>

    </nav>

    <div class="get-in-touch">
      <div class="left-box">
        <h1>Get in Touch</h1>
        <p
          style="
            color: rgba(255, 255, 255, 0.842);
            font-size: 21px;
            margin-top: -30px;
          "
        >
          Have a question or want to work together? Drop us a message!
        </p>
        <div class="email" style="margin-top: 50px">
          <i
            class="fa-regular fa-envelope"
            style="
              color: rgba(210, 156, 241, 0.884);
              font-size: 30px;
              background-color: rgba(77, 28, 117, 0.253);
              display: inline-block;
              padding: 12px 10px;
              border-radius: 5px;
            "
          ></i>
          <div class="email-text">
            <h2>Email</h2>
            <p>sujit.kd2001@gmail.com</p>
          </div>
        </div>

        <div class="email">
          <i
            class="fa-solid fa-location-dot"
            style="
              color: rgba(255, 139, 220, 0.884);
              font-size: 28px;
              background-color: #eb85cc17;
              display: inline-block;
              padding: 12px 10px;
              border-radius: 5px;
            "
          ></i>
          <div class="email-text">
            <h2>Location</h2>
            <p>Pitampura, Delhi 110034</p>
          </div>
        </div>
      </div>

      <div class="right-box">
        <form method="post">
          <div class="container-form">
            <input type="text" name="name" placeholder="Your Name" />
            <input type="email" name="email" placeholder="Your email" />
            <input type="text" name="subject" placeholder="Subject" />
            <textarea
              rows="6"
              cols="40"
              style="
                width: 92.5%;
                margin-left: 20px;
                padding-top: 20px;

                border-radius: 10px;
                
                margin-top: 20px;
                background-color: rgba(39, 43, 61, 0.514);
                color: gray;
                font-size: 20px;

                padding-left: 20px;
                border: 1px solid rgba(69, 78, 88, 0.678);
              "
            >Your message</textarea
            >
            <button class="message">
              Send Message <i class="fa-solid fa-paper-plane"></i>
            </button>
          </div>
        </form>
      </div>
    </div>
  </body>
